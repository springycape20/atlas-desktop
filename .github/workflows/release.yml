name: Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify Colab history and browsing in Electron
        run: npm run test:colab-ui
      - name: Verify Assistant chat and provider import browsing
        run: npm run test:assistant-ui
      - name: Download speech runtime and models
        shell: pwsh
        run: ./Setup-ATLAS.ps1 -SkipDependencies
      - run: npm run dist:win
      - name: Verify packaged version and new app files
        run: node build/verify-release.cjs
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: build/release-notes.md
          fail_on_unmatched_files: true
          files: |
            dist/ATLAS-Setup-*.exe
            dist/ATLAS-Setup-*.exe.blockmap
            dist/latest.yml
