name: Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify Colab history and browsing in Electron
        run: npm run test:colab-ui
      - name: Verify Assistant chat and provider import browsing
        run: npm run test:assistant-ui
      - name: Verify workflow graph and permission controls
        run: |
          npm run test:graph-ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:approvals-ui
      - name: Download speech runtime and models
        shell: pwsh
        run: ./Setup-ATLAS.ps1 -SkipDependencies
      - run: npm run dist:win
      - name: Verify packaged version and new app files
        run: node build/verify-release.cjs
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          body_path: build/release-notes.md
          fail_on_unmatched_files: true
          files: |
            dist/ATLAS-Setup-*.exe
            dist/ATLAS-Setup-*.exe.blockmap
            dist/latest.yml
