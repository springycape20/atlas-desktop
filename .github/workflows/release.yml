name: Windows release

on:
  push:
    tags:
      - 'v*'
  # Manual runs build and verify everything, then publish only a draft that
  # creates no tag and is invisible to the in-app updater.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
    # Signing remains optional following the owner's recorded unsigned-release decision.
    # Public tags require a matching technical dependency review; when signing is enabled,
    # the actual publisher and signatures are mandatory (see docs/PATCH-RELEASE-REVIEW.md).
    env:
      SIGNING: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
      ATLAS_REQUIRE_SIGNATURE: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && '1' || '' }}
      UPDATER_PUBLISHER: ${{ vars.SIGNPATH_UPDATER_PUBLISHER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Require documented release decision and dependency review for public tags
        run: node build/release-policy.cjs
      - run: npm ci
      - name: Check production dependency advisories
        run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - name: Verify Colab history and browsing in Electron
        run: npm run test:colab-ui
      - name: Verify Assistant chat and provider import browsing
        run: npm run test:assistant-ui
      - name: Verify workflow graph and permission controls
        run: |
          npm run test:graph-ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:approvals-ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:dispute-ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:settings-ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:power-ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:navigation-ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:files-ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:pty-ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:pty-render-ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:restore-ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:recovery-ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:data-ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:preview-ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:release-ui
      - name: Download speech runtime and models
        shell: pwsh
        run: ./Setup-ATLAS.ps1 -SkipDependencies
      # A full build writes app-update.yml for the updater. With signing on, ATLAS.exe is then
      # signed and the installer rebuilt from that signed app, keeping app-update.yml.
      - name: Build the app and installer
        env:
          UPDATER_PUBLISHER: ${{ vars.SIGNPATH_UPDATER_PUBLISHER }}
        run: |
          npm run build:syntax
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $extra = @()
          # Set only after a signed release confirms the certificate's publisher name: the updater
          # then refuses any update not signed by that publisher.
          if ($env:UPDATER_PUBLISHER) { $extra = @("-c.win.signtoolOptions.publisherName=$env:UPDATER_PUBLISHER") }
          npx electron-builder --win nsis --x64 --publish never @extra
      - name: Upload ATLAS.exe for signing
        id: unsigned-app
        if: env.SIGNING == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-app-exe
          path: dist/win-unpacked/ATLAS.exe
          if-no-files-found: error
      - name: Sign ATLAS.exe with SignPath
        if: env.SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'atlas-desktop' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: app-exe
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          # Each signing request waits for manual approval in SignPath.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist/win-unpacked
      - name: Rebuild the installer from the signed app
        if: env.SIGNING == 'true'
        run: npx electron-builder --win nsis --x64 --publish never --prepackaged dist/win-unpacked
      - name: Upload the installer for signing
        id: unsigned-installer
        if: env.SIGNING == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-installer
          path: dist/ATLAS-Setup-*.exe
          if-no-files-found: error
      - name: Sign the installer with SignPath
        if: env.SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'atlas-desktop' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist/signed
      - name: Refresh updater files for the signed installer
        if: env.SIGNING == 'true'
        run: node build/finalize-signed-installer.cjs dist/signed
      - name: Verify packaged version and new app files
        run: node build/verify-release.cjs
      - name: Verify packaged PDF text extraction without rendering-only assets
        run: npm run test:pdf-package-ui
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: ${{ github.ref_type != 'tag' }}
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('ci-draft-{0}', github.run_id) }}
          generate_release_notes: true
          body_path: build/release-notes.md
          fail_on_unmatched_files: true
          files: |
            dist/ATLAS-Setup-*.exe
            dist/ATLAS-Setup-*.exe.blockmap
            dist/latest.yml
