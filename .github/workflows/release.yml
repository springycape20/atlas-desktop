name: Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download speech runtime and models
        shell: pwsh
        run: ./Setup-ATLAS.ps1 -SkipDependencies
      - run: npm run dist:win
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/ATLAS-Setup-*.exe
