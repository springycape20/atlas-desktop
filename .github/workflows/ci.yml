name: CI

# Run the same checks as a release on every push and pull request, so problems
# are found before a version is tagged.
on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check production dependency advisories
        run: npm audit --omit=dev --audit-level=high
      - name: Check formatting (run npm run format to fix)
        run: npm run format:check
      - run: npm test
      - name: Verify Colab history and browsing in Electron
        run: npm run test:colab-ui
      - name: Verify Assistant chat and provider import browsing
        run: npm run test:assistant-ui
      - name: Verify workflow graph and permission controls
        run: |
          npm run test:graph-ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:approvals-ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:dispute-ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:settings-ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:power-ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:navigation-ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:files-ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:pty-ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:restore-ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:preview-ui
